
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Cristina Noguera Martinez</title>
    <link rel="stylesheet" href="assets/css/tailwind.css">
    <link rel="icon" href="data:,">
    <script src="assets/js/contact.js" defer></script>
</head>

<body>

    <header class="bg-[#CCD5AE] border border-black p-5">
        <div class="flex flex-col md:flex-row justify-between items-center gap-4">

            <h1 class="text-xl font-bold">
                Cristina Noguera Martinez
            </h1>

            <nav>
                <ul class="flex flex-wrap justify-center gap-5">
                    <li><a href="index.html" class="font-bold text-black hover:text-[#6B705C]">Home</a></li>
                    <li><a href="about.html" class="font-bold text-black hover:text-[#6B705C]">About</a></li>
                    <li><a href="resume.html" class="font-bold text-black hover:text-[#6B705C]">Resume</a></li>
                    <li><a href="projects.html" class="font-bold text-black hover:text-[#6B705C]">Projects</a></li>
                    <li><a href="contact.html" class="font-bold text-black hover:text-[#6B705C]">Contact</a></li>
                    <li><a href="sample-projects/mywork.html" class="font-bold text-black hover:text-[#6B705C]">Sample Project</a></li>
                </ul>
            </nav>

        </div>
    </header>

    <main>

        
        <!-- Contact Section -->
        <section id="contact" class="bg-[#FAEDCD] p-10 rounded-xl mt-10 mb-10 max-w-4xl mx-auto">

            <h2 class="text-2xl font-bold mb-6">
                Contact Me
            </h2>

            <form id="contact-form" class="flex flex-col gap-5">

                <div class="flex flex-col gap-2">
                    <label for="name" class="font-semibold">Name</label>
                    <input type="text" id="name" name="name"
                        placeholder="Enter your name"
                        class="border border-[#CCD5AE] rounded-lg p-3">
                    <small id="nameError" class="error"></small>
                </div>

                <div class="flex flex-col gap-2">
                    <label for="email" class="font-semibold">Email</label>
                    <input type="email" id="email" name="email"
                        placeholder="Enter your email"
                        class="border border-[#CCD5AE] rounded-lg p-3">
                    <small id="emailError" class="error"></small>
                </div>

                <div class="flex flex-col gap-2">
                    <label for="message" class="font-semibold">Message</label>
                    <textarea id="message" name="message" rows="6"
                        placeholder="Write your message..."
                        class="border border-[#CCD5AE] rounded-lg p-3"></textarea>
                    <small id="messageError" class="error"></small>
                </div>

                <button type="submit" id="submit-button" disabled
                    class="bg-[#FFC13B] text-black font-bold p-3 rounded-lg hover:bg-[#E9EDC9] disabled:opacity-50">
                    Submit
                </button>

            </form>

        </section>


    </main>

    <footer class="bg-[#CCD5AE] border border-black p-5 text-center">

        <p>
            <a href="copyright.html" class="font-semibold text-black hover:text-[#6B705C]">
                Copyright
            </a>
            &copy; 2026 Cristina Noguera Martinez. All rights reserved.
        </p>

    </footer>

</body>

</html>
